[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "whisper-note"
version = "1.1.0"
description = "Voice-to-markdown note taker. Hold Ctrl+Alt+Space, speak, release."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "whisper", "voice", "speech-to-text", "transcription",
    "markdown", "notes", "openai", "faster-whisper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

# GTK3 bindings (python3-gi) are a system package and cannot be listed here.
# See README — Installation for the apt command.
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
    "pynput>=1.7",
]

[project.optional-dependencies]
# Formatter backends — install the one matching WN_LLM_BACKEND.
# Local backend (default): in-process llama.cpp loading a GGUF model.
#   pip install "whisper-note[local]"
local = [
    "llama-cpp-python>=0.2",
]
# HTTP backend: OpenAI-compatible endpoint (Ollama / OpenAI / Claude).
#   pip install "whisper-note[http]"
http = [
    "openai>=1.0",
    "httpx>=0.25",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "black>=24",
    "build",
    "twine",
]

# ---------------------------------------------------------------------------
# Entry points
# ---------------------------------------------------------------------------
[project.scripts]
whisper-note = "whisper_note.cli:main"

# ---------------------------------------------------------------------------
# URLs  — update 0xSh3ru before publishing
# ---------------------------------------------------------------------------
[project.urls]
Homepage      = "https://github.com/0xSh3ru/whisper-note"
"Bug Tracker" = "https://github.com/0xSh3ru/whisper-note/issues"
Changelog     = "https://github.com/0xSh3ru/whisper-note/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Package discovery — src layout
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where   = ["src"]
include = ["whisper_note*"]

# ---------------------------------------------------------------------------
# Developer tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length    = 100
target-version = "py310"
src            = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length    = 100
target-version = ["py310"]
